<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>La Gestion Étoilée Lab</title>
<style>
:root{--bg:#f7f3e8;--card:#fff;--ink:#0f1b3d;--mut:#5b6580;--btn:#0f1b3d;--btnt:#fff;--acc:#b8892b;--ok:#1f7a4d;--ko:#b3342f;--bd:#e3dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1226;--card:#141f3d;--ink:#f2eddc;--mut:#a5adc6;--btn:#d9b25f;--btnt:#0b1226;--acc:#d9b25f;--ok:#5fd09a;--ko:#ff8b84;--bd:#26335c}}
:root[data-theme=dark]{--bg:#0b1226;--card:#141f3d;--ink:#f2eddc;--mut:#a5adc6;--btn:#d9b25f;--btnt:#0b1226;--acc:#d9b25f;--ok:#5fd09a;--ko:#ff8b84;--bd:#26335c}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:#0f1b3d;color:#f2eddc;padding:14px 16px}header b{font:700 20px Georgia,serif;color:#e2bd6b}header small{display:block;color:#c9cfe2}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:1px solid var(--bd);background:none;color:var(--ink);padding:8px 12px;border-radius:20px;font:inherit}nav button.on{background:var(--btn);color:var(--btnt)}
main{max-width:760px;margin:auto;padding:12px;max-width:100%}
h1,h2,h3{font-family:Georgia,serif;margin:.4em 0}h1{font-size:24px}h2{font-size:20px}h3{font-size:17px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.m{color:var(--mut);font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.b{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 14px;font:inherit;margin:3px 3px 3px 0}.b.s{background:none;color:var(--ink);border:1px solid var(--bd)}
input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:3px 0}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:1px 8px}
.ok{color:var(--ok)}.ko{color:var(--ko)}.t{background:var(--bg);border-left:3px solid var(--acc);padding:8px;margin:6px 0;border-radius:6px}.u{background:var(--bd);padding:8px;margin:6px 0;border-radius:6px;text-align:right}
.demo{background:#b8892b22;border:1px dashed var(--acc);padding:8px;border-radius:8px;font-size:14px}
.b,nav button,select,input{min-height:44px}</style><meta name="theme-color" content="#0f1b3d"></head><body>
<header><b>LA GESTION ÉTOILÉE LAB</b><small>Apprendre. Comprendre. Pratiquer. Exceller.</small></header>
<div id="err" class="demo" hidden>Une erreur est survenue. Rechargez la page : vos données locales sont conservées.</div><nav id="nv"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fm=n=>Math.round(n).toLocaleString('fr-FR')+' F';
const D0=()=>({v:2,acts:[],ans:{},cards:{},custom:[],role:'invité',name:'',lvl:'DT HR',fails:[],st:{},td:{},hist:[],sess:[],pid:''});let S=D0();
let SAVE='ok';try{S=Object.assign(S,JSON.parse(localStorage.getItem('gel')||'{}'));['acts','custom','fails','hist','sess'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});['ans','cards','st','td'].forEach(k=>{if(!S[k]||typeof S[k]!='object'||Array.isArray(S[k]))S[k]={}})}catch(e){SAVE='ko'}
const save=()=>{try{localStorage.setItem('gel',JSON.stringify(S));SAVE='ok'}catch(e){SAVE='ko'}},log=t=>{S.acts.unshift({t,d:new Date().toLocaleString('fr-FR')});S.acts=S.acts.slice(0,30);save()};
const M=[
['Contrôle Nourriture et Boissons','Suivre coûts, ratios et marges en restauration.',['Fiche technique et coût matière','Coefficient multiplicateur','Inventaire et consommation'],'Coût matière consommé = stock initial + achats − stock final. Prix de vente HT = coût matière × coefficient.'],
['Mercatique hôtelière','Comprendre le marché et attirer la clientèle.',['Étude de marché','Segmentation et ciblage','Mix marketing (4P)'],'4P : Produit, Prix, Place (distribution), Promotion. Segmenter = regrouper des clients aux besoins proches.'],
['Technologie hôtelière','Maîtriser matériels, techniques et organisation des services.',['Organisation de la cuisine','Équipements et entretien','Techniques de service'],'FIFO : premier entré, premier sorti. Toujours étiqueter et dater les denrées.'],
['Sciences appliquées à l’alimentation et à l’hygiène','Garantir la sécurité sanitaire des aliments.',['Microbiologie de base','Chaîne du froid','Hygiène et HACCP'],'Froid positif : 0 à +4 °C. Zone de danger bactérien : environ +10 à +63 °C. Valeurs usuelles d’enseignement : à vérifier selon le produit et la réglementation en vigueur.'],
['Législation hôtelière et touristique','Connaître le cadre juridique de l’activité.',['Cadre de l’exploitation','Droit du travail','Responsabilité de l’hôtelier'],'Vérifier toujours les textes officiels en vigueur : ces contenus de démonstration n’en tiennent pas lieu.'],
['Billetterie et tarification','Calculer, tarifer et suivre l’activité commerciale.',['Tarification','Taux d’occupation','Réservation'],'Taux d’occupation = chambres vendues ÷ chambres disponibles × 100.'],
['Gestion des stocks et approvisionnements','Acheter juste et limiter les pertes.',['Commande et réception','Stock de sécurité','Méthodes FIFO / CMUP'],'Stock de sécurité : réserve qui absorbe les retards et les variations de consommation.'],
['Comptabilité et contrôle de gestion hôtelière','Mesurer la rentabilité de l’établissement.',['Charges fixes et variables','Seuil de rentabilité','Indicateurs (RevPAR)'],'Seuil de rentabilité : chiffre d’affaires pour lequel le résultat est nul. RevPAR = recettes hébergement ÷ chambres disponibles.']];
const Q=[
{s:0,d:1,q:'Le coût matière consommé se calcule par :',o:['stock initial + achats − stock final','ventes − marge','somme des achats seuls','stock final − stock initial'],a:0,e:'On a consommé ce qu’on avait, plus ce qu’on a acheté, moins ce qui reste.'},
{s:0,d:2,q:'Coût matière d’un plat : 1 200 F ; coefficient 3,5. Prix de vente HT (F) ?',a:4200,e:'1 200 × 3,5 = 4 200 F.'},
{s:0,d:2,q:'Ventes : 500 000 F ; ratio coût matière visé : 30 %. Coût matière maximal (F) ?',a:150000,e:'500 000 × 0,30 = 150 000 F.'},
{s:1,d:1,q:'Les 4P du mix marketing sont :',o:['Produit, Prix, Place, Promotion','Personnel, Prix, Profit, Publicité','Produit, Plan, Pays, Public','Prix, Paiement, Promotion, Personnel'],a:0,e:'Produit, Prix, Place (distribution) et Promotion.'},
{s:1,d:2,q:'Segmenter un marché, c’est :',o:['baisser les prix','diviser les clients en groupes aux besoins proches','copier la concurrence','réduire le personnel'],a:1,e:'La segmentation permet d’adapter l’offre à chaque groupe.'},
{s:2,d:1,q:'FIFO signifie :',o:['dernier entré, premier sorti','premier entré, premier sorti','prix fixe, prix offert','froid immédiat, froid obligatoire'],a:1,e:'Les denrées les plus anciennes sont utilisées en premier.'},
{s:3,d:1,q:'Température de conservation au froid positif :',o:['−18 °C','0 à +4 °C','+15 à +20 °C','+30 °C'],a:1,e:'Le froid positif se situe entre 0 et +4 °C.'},
{s:3,d:2,q:'La zone de danger où les bactéries se multiplient vite se situe environ entre :',o:['−20 et 0 °C','+10 et +63 °C','+70 et +100 °C','0 et +4 °C'],a:1,e:'Éviter de laisser les aliments dans cette zone.'},
{s:4,d:2,q:'Un contrat de travail écrit sert surtout à :',o:['remplacer la paie','prouver les engagements des deux parties','éviter toute cotisation','fixer le menu'],a:1,e:'Démonstration : consultez le Code du travail du Bénin pour les règles exactes.'},
{s:5,d:1,q:'Le taux d’occupation se calcule :',o:['vendues ÷ disponibles × 100','disponibles ÷ vendues','recettes ÷ charges','prix × nuits'],a:0,e:'Chambres vendues ÷ chambres disponibles × 100.'},
{s:5,d:1,q:'40 chambres vendues sur 50 disponibles. Taux d’occupation (%) ?',a:80,e:'40 ÷ 50 × 100 = 80 %.'},
{s:6,d:2,q:'Le stock de sécurité sert à :',o:['augmenter les pertes','absorber retards et variations de consommation','remplacer l’inventaire','baisser les prix'],a:1,e:'C’est une réserve contre les aléas.'},
{s:6,d:2,q:'Stock initial 80 000 F, achats 220 000 F, stock final 60 000 F. Consommation (F) ?',a:240000,e:'80 000 + 220 000 − 60 000 = 240 000 F.'},
{s:7,d:3,q:'Le RevPAR est égal à :',o:['recettes hébergement ÷ chambres disponibles','recettes ÷ clients','charges ÷ recettes','chambres vendues ÷ clients'],a:0,e:'Recettes d’hébergement ÷ chambres disponibles.'},
{s:7,d:3,q:'Le seuil de rentabilité est le chiffre d’affaires pour lequel :',o:['le résultat est nul','les stocks sont nuls','les charges sont nulles','les pertes sont maximales'],a:0,e:'En dessous : perte ; au-dessus : bénéfice.'},
{s:0,d:2,c:'Restaurant « Chez Mama », Cotonou',q:'Une portion de riz sauce arachide coûte 600 F en matière ; ratio visé 30 %. Prix de vente HT (F) ?',a:2000,e:'Prix = coût ÷ ratio = 600 ÷ 0,30 = 2 000 F.'},
{s:1,d:2,c:'Hôtel 3 étoiles à Parakou',q:'Pour attirer les cadres en mission, quelle action relève de la « Promotion » ?',o:['Réduire la taille des chambres','Convention avec les entreprises et annonces ciblées','Changer de fournisseur de riz','Baisser les charges fixes'],a:1,e:'Informer et inciter la cible : c’est la Promotion.'},
{s:2,d:1,c:'Cuisine d’un hôtel',q:'Un chef reçoit du poisson frais. Première action au contrôle à réception ?',o:['Le ranger sans le regarder','Vérifier température, aspect et DLC','Le laver à l’eau chaude','Le laisser à température ambiante'],a:1,e:'Le contrôle à réception précède tout rangement.'},
{s:3,d:2,c:'Buffet d’un événement',q:'Un plat chaud en buffet doit être maintenu à une température :',o:['inférieure à +10 °C','supérieure à +63 °C','proche de +30 °C','indifférente'],a:1,e:'Au-dessus de +63 °C, hors de la zone de danger.'},
{s:4,d:2,c:'Recrutement d’un serveur',q:'Avant d’embaucher, la démarche prudente est de :',o:['se fier à un accord oral seul','vérifier les textes en vigueur et formaliser par écrit','éviter tout document','copier un modèle sans le lire'],a:1,e:'Formaliser par écrit après vérification des textes officiels.'},
{s:5,d:2,c:'Hôtel de 30 chambres',q:'Recettes hébergement de la nuit : 450 000 F ; 30 chambres disponibles. RevPAR (F) ?',a:15000,e:'450 000 ÷ 30 = 15 000 F.'},
{s:6,d:2,c:'Réception de marchandises',q:'Sur 20 kg de tomates livrées, 3 kg sont abîmés. Part à signaler (%) ?',a:15,e:'3 ÷ 20 × 100 = 15 %.'},
{s:7,d:3,c:'Restaurant, mois de septembre',q:'Charges fixes 600 000 F ; taux de marge sur coûts variables 40 %. Seuil de rentabilité (F) ?',a:1500000,e:'600 000 ÷ 0,40 = 1 500 000 F.'}];
const C=[[0,'Formule du coût matière consommé ?','Stock initial + achats − stock final'],[0,'Prix HT à partir du coût et du coefficient ?','Coût matière × coefficient'],[1,'Que signifient les 4P ?','Produit, Prix, Place, Promotion'],[2,'Que veut dire FIFO ?','Premier entré, premier sorti'],[3,'Plage du froid positif ?','0 à +4 °C'],[5,'Formule du taux d’occupation ?','Chambres vendues ÷ disponibles × 100'],[6,'À quoi sert le stock de sécurité ?','Absorber retards et variations de consommation'],[7,'Définition du seuil de rentabilité ?','CA pour lequel le résultat est nul']];
const AQ=()=>Q.map((q,i)=>({...q,id:'q'+i,src:0,ch:CH[i]})).concat(S.custom.map(q=>({...q,src:q.src||1})));
const CH=[2,1,0,2,1,0,1,0,1,1,1,1,0,2,1,1,2,0,1,1,1,0,1],TG=q=>['Exercice pédagogique original','Sujet fourni par un enseignant','Épreuve officielle vérifiée'][q.src||0],num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.').replace(/[^\d.\-]/g,''));
const sp=i=>{const l=AQ().filter(q=>q.s==i),k=l.filter(q=>S.ans[q.id]).length;return l.length?Math.round(k/l.length*100):0};
const due=()=>C.map((c,i)=>i).filter(i=>!S.cards[i]||S.cards[i].due<=Date.now());
let cur={v:'home'},qz=null,tm=null,tu=null,fcShow=0;
const go=(v,a)=>{cur={v,a};render()};
const TABS=[['home','Accueil'],['beta','Test bêta'],['tutor','Tuteur'],['lib','Cours'],['quiz','Quiz'],['fc','Cartes'],['sim','Hôtel-École 360'],['bilan','Bilan'],['prof','Profil'],['teach','Enseignant']];
$('#nv').innerHTML=TABS.map(t=>`<button data-v="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const V={
home(){const A=AQ(),ok=Object.values(S.ans).filter(Boolean).length,n=Object.keys(S.ans).length,g=Math.round(ok/A.length*100);
return `<h1>Bienvenue${S.name?', '+esc(S.name):''}</h1><div class="c"><b>Progression globale</b> : ${g} %${bar(g)}<p class="m">${ok} bonne(s) réponse(s) sur ${A.length} questions disponibles. Calculé sur cet appareil.</p></div>
<div class="c"><b>Statistiques</b><p>Questions tentées : ${n} · Réussies : ${ok} · Cartes à réviser aujourd’hui : ${due().length}</p></div>
<div class="c"><b>Objectifs de révision</b><p>${due().length?`Réviser ${due().length} carte(s) <button class="b s" onclick="go('fc')">Ouvrir</button>`:'Aucune carte due. Bravo !'}</p><p>${S.fails.length?`${S.fails.length} question(s) à refaire <button class="b s" onclick="qFails()">Refaire</button>`:'Aucun quiz à poursuivre.'}</p></div>
<h2>Matières</h2><div class="g">${M.map((m,i)=>`<button class="c b s" style="text-align:left" onclick="go('course',${i})"><b>${esc(m[0])}</b><br><span class="m">${sp(i)} %</span></button>`).join('')}</div>
<h2>Dernières activités</h2><div class="c">${S.acts.slice(0,5).map(a=>`<div class="m">${a.d} — ${esc(a.t)}</div>`).join('')||'<span class="m">Aucune activité pour l’instant.</span>'}</div>`},
tutor(){if(!tu)return `<h1>Mon tuteur pédagogique</h1><div class="demo"><b>Tuteur à règles, pas une IA générative</b> : aucune IA n’est connectée. Scénarios écrits à l’avance ; vos réponses sont comparées à un nombre ou à des mots-clés, sans compréhension du texte. Les modes (comprendre, exercice pas à pas, examen, révision, erreur, simulation d’épreuve) nécessitent une API d’IA à configurer côté serveur. Le tuteur ne donne jamais de corrigé officiel.</div>${Object.keys(T).map(k=>`<button class="b s" style="display:block;width:100%;text-align:left" onclick="tStart('${k}')">${S.td[k]?'✔ ':''}${esc(M[T[k].s][0])} — ${esc(T[k].n)}</button>`).join('')}`;
return `<h1>${esc(T[tu.k].n)}</h1><div class="demo">Tuteur à règles (scénario prédéfini, pas une IA)</div>${tu.k=='lg'?'<div class="demo">⚠ Législation : à valider par une source officielle.</div>':''}<div>${tu.chat.map(m=>`<div class="${m.r}">${esc(m.x)}</div>`).join('')}</div>${tu.end?`<button class="b" onclick="tu=null;render()">Autres scénarios</button>`:`<input id="ti" placeholder="Votre réponse…" onkeydown="if(event.key=='Enter')tSend()"><button class="b" onclick="tSend()">Envoyer</button>`}`},
lib(){return `<h1>Bibliothèque</h1><p class="m">Contenus de démonstration originaux (niveau DT HR / licence). Ils ne proviennent pas des Tomes de La Gestion Étoilée ni d’épreuves officielles. Les contenus authentiques s’ajoutent par l’espace enseignant (import JSON).</p>${M.map((m,i)=>`<div class="c"><b>${esc(m[0])}</b> <span class="tag">${sp(i)} %</span><br><button class="b s" onclick="go('course',${i})">Ouvrir</button></div>`).join('')}`},
course(i){const m=M[i];return `<button class="b s" onclick="go('lib')">← Cours</button><h1>${esc(m[0])}</h1><div class="c"><b>Présentation</b><p>${esc(m[1])}</p><b>Objectifs</b><ul>${m[2].map(c=>`<li>Expliquer : ${esc(c)}</li>`).join('')}</ul><b>Chapitres</b><ol>${m[2].map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>${i==4?'<div class="demo">⚠ Législation : contenu de démonstration à valider par une source officielle (textes en vigueur au Bénin).</div>':''}<div class="c"><b>Fiche de révision</b><p>${esc(m[3])}</p></div><div class="c"><b>Progression</b> ${sp(i)} %${bar(sp(i))}<button class="b" onclick="qStart(AQ().filter(q=>q.s==${i}))">Exercices et quiz</button></div>`},
quiz(){if(!qz)return `<h1>Quiz et examens blancs</h1><div class="c m">Types : <span class="tag">Exercice pédagogique original</span> <span class="tag">Sujet fourni par un enseignant</span>. Aucune épreuve passée n’est incluse : l’authenticité et les droits d’usage doivent d’abord être vérifiés.</div><button class="b" onclick="qStart(AQ())">Examen blanc (toutes matières, 1 min/question)</button><button class="b" onclick="qStart(AQ().filter(q=>q.c))">Exercices contextualisés DT HR</button>${S.fails.length?`<button class="b s" onclick="qFails()">Refaire les questions échouées (${S.fails.length})</button>`:''}<h3>Par matière</h3>${M.map((m,i)=>`<button class="b s" onclick="qStart(AQ().filter(q=>q.s==${i}))">${esc(m[0])}</button>`).join('')}`;
if(qz.done||qz.i>=qz.l.length)return qEnd();const q=qz.l[qz.i],r=qz.r;
return `<div class="m">Question ${qz.i+1}/${qz.l.length} · Niveau ${q.d}/3 · ⏱ <span id="tm"></span> · <span class="tag">${TG(q)}</span>${q.ref?` Réf. : ${esc(q.ref)}`:''}</div><div class="c">${q.c?`<span class="m">Contexte : ${esc(q.c)}</span><br>`:''}${q.s==4?'<div class="demo">⚠ Législation : à valider par une source officielle.</div>':''}<b>${esc(q.q)}</b>${r?'':q.o?q.o.map((o,k)=>`<br><button class="b s" style="width:100%;text-align:left" onclick="qAns(${k})">${esc(o)}</button>`).join(''):`<input id="qa" inputmode="decimal" placeholder="Votre calcul / réponse"><button class="b" onclick="qAns($('#qa').value)">Valider</button>`}</div>${r?`<div class="c"><b class="${r.ok?'ok':'ko'}">${r.ok?'Correct':'Incorrect'}</b><p>${esc(q.e)}</p><button class="b" onclick="qz.i++;qz.r=null;render()">Suivant</button></div>`:''}`},
fc(){const d=due().sort((a,b)=>(S.cards[a]?S.cards[a].box:1)-(S.cards[b]?S.cards[b].box:1));if(!d.length){const n=Math.min(...Object.values(S.cards).map(c=>c.due));return `<h1>Cartes de mémorisation</h1><div class="c">Aucune carte à réviser. Prochaine révision : ${new Date(n).toLocaleDateString('fr-FR')}.</div>`}
const i=d[0],c=C[i];return `<h1>Cartes de mémorisation</h1><p class="m">${d.length} carte(s) à réviser · ${Object.keys(S.cards).length}/${C.length} déjà vues</p><div class="c"><span class="tag">${esc(M[c[0]][0])}</span><p><b>${esc(c[1])}</b></p>${fcShow?`<p>${esc(c[2])}</p><button class="b s" onclick="fcG(${i},0)">À revoir</button><button class="b s" onclick="fcG(${i},1)">En cours d’acquisition</button><button class="b" onclick="fcG(${i},2)">Maîtrisé</button><p class="m">Prochaine révision : demain / dans 3 jours / dans 7 jours.</p>`:`<button class="b" onclick="fcShow=1;render()">Révéler la réponse</button>`}</div>`},
sim(){return `<h1>Hôtel-École 360</h1><p class="m">Simulation pédagogique : les résultats suivent des règles explicites (voir « Détail du calcul »). Ce sont des données fictives.</p><select id="sc" onchange="simCalc()">${SC.map((s,i)=>`<option value="${i}">${esc(s[0])}</option>`).join('')}</select><label class="m">Prix de vente par couvert (F)</label><input id="sp" type="number" value="2500" oninput="simCalc()"><label class="m">Portions achetées (achats)</label><input id="sq" type="number" value="60" oninput="simCalc()"><label class="m">Gestion des stocks</label><select id="sm" onchange="simCalc()"><option value="1">FIFO strict, froid contrôlé (3 % de pertes)</option><option value="0">Sans méthode (12 % de pertes)</option></select><div id="so" class="c"></div><button class="b s" onclick="simSc()">Réinitialiser le scénario</button>`},
beta(){if(!S.pid){S.pid=pidGen();save()}return `<h1>Test bêta</h1><div class="c"><b>Votre code anonyme : ${S.pid}</b><p class="m">N’écrivez ni nom ni numéro de téléphone. Vos réponses restent sur cet appareil (aucun serveur). Seul le bilan que vous copiez puis envoyez vous-même quitte votre téléphone.</p></div><div class="c"><b>1. Choisir le test</b><select id="bs" onchange="bSel()">${M.map((m,i)=>`<option value="${i}">${esc(m[0])}</option>`).join('')}</select><select id="bc"></select><button class="b" onclick="bGo()">Commencer</button><p class="m">Banque réduite : 0 à 4 questions par chapitre. Chronomètre : 1 min par question.</p></div><div class="c m">Sessions terminées sur cet appareil : ${S.sess.length}${S.sess.length?` <button class="b s" onclick="bLast()">Revoir mon dernier bilan</button>`:''}</div>`},

const T={cm:{s:0,n:'Calculer le coût matière d’un plat',st:[{m:'Que savez-vous déjà du coût matière d’un plat ? Écrivez librement.'},{m:'Merci. Question guidée : que faut-il connaître pour calculer le coût d’UNE portion ? Indice : la fiche technique (quantités par portion).'},{m:'Étapes : 1) lister ingrédients et quantités ; 2) quantité en kg × prix au kg ; 3) additionner. À vous : 250 g de poulet à 3 000 F/kg + 100 g de riz à 800 F/kg. Coût par portion (F) ?',a:830,e:'0,25 × 3 000 = 750 ; 0,1 × 800 = 80 ; total 830 F.'},{m:'Méthode complète : coût portion = Σ (kg × prix au kg). Exercice similaire : 200 g de poisson à 4 000 F/kg + 150 g d’igname à 500 F/kg. Coût (F) ?',a:875,e:'0,2 × 4 000 = 800 ; 0,15 × 500 = 75 ; total 875 F.'}]},

mk:{s:1,n:'Mix marketing et segmentation',st:[{m:'Que savez-vous du marketing d’un restaurant ou d’un hôtel ?'},{m:'Question guidée : citez les 4 éléments du mix marketing. Indice : ils commencent tous par P.',k:['produit','prix','place','promotion'],n:3,h:'Pensez à ce que l’on vend, à son coût, à où on le vend et à comment on le fait connaître.',e:'Produit, Prix, Place (distribution), Promotion.'},{m:'Un maquis veut attirer les fonctionnaires à midi. Citez un critère de segmentation utile.',k:['âge','age','revenu','besoin','lieu','profession','budget'],h:'Pensez à qui sont ces clients : leur métier, leur budget, leur besoin.',e:'Critères : âge, revenu, besoin, lieu, profession… Ici : menu rapide à prix fixe.'}]},
tc:{s:2,n:'Rangement et étiquetage (FIFO)',st:[{m:'Comment rangez-vous les denrées en chambre froide aujourd’hui ?'},{m:'Question guidée : une nouvelle livraison arrive. Où placer les nouveaux produits par rapport aux anciens ? Indice : FIFO.',k:['derrière','arrière','fond','après','fifo','premier'],h:'Premier entré, premier sorti : que doit-on voir en premier ?',e:'Anciens devant (sortis d’abord), nouveaux derrière : FIFO.'},{m:'Quelles informations mettre sur une étiquette de denrée ?',k:['date','nom','produit','dlc','réception','lot'],n:2,h:'Quoi ? Et jusqu’à quand ?',e:'Nom du produit, date de réception ou de préparation, date limite de consommation.'}]},
sc:{s:3,n:'Chaîne du froid et bactéries',st:[{m:'Que se passe-t-il quand un aliment reste longtemps à l’air libre ?'},{m:'Question guidée : quelle est la température maximale du froid positif (°C) ?',a:4,h:'Le froid positif va de 0 à +… °C.',e:'Le froid positif se situe entre 0 et +4 °C.'},{m:'Pourquoi éviter la zone de +10 à +63 °C ? Un mot clé : les bactéries…',k:['bact','multipl','microb'],h:'Que font les microbes à ces températures ?',e:'Les bactéries s’y multiplient vite : risque d’intoxication.'}]},
lg:{s:4,n:'Contrat et textes officiels',st:[{m:'Quelles obligations un employeur a-t-il selon vous ?'},{m:'Question guidée : pourquoi vaut-il mieux écrire un contrat de travail ? Indice : preuve.',k:['preuve','prouver','engagement','écrit','droit','obligation'],h:'Que se passe-t-il en cas de désaccord, sans trace écrite ?',e:'L’écrit prouve les engagements et protège les deux parties.'},{m:'Où vérifier une règle précise, comme une durée de préavis ?',k:['code du travail','journal officiel','texte','officiel','loi','décret','decret'],h:'Cherchez la source qui fait autorité, pas la mémoire.',e:'Dans les textes officiels en vigueur (Code du travail, Journal officiel). Ce tuteur ne cite aucun article de mémoire.'}]},
st:{s:6,n:'Consommation et stock de sécurité',st:[{m:'Comment savez-vous combien de marchandises ont été utilisées ?'},{m:'Stock initial 50 000 F, achats 120 000 F, stock final 40 000 F. Consommation (F) ?',a:130000,h:'Stock initial + achats − stock final.',e:'50 000 + 120 000 − 40 000 = 130 000 F.'},{m:'À quoi sert un stock de sécurité ?',k:['retard','aléa','alea','rupture','variation','imprévu','imprevu'],h:'Que se passe-t-il si le livreur est en retard ?',e:'Il évite la rupture en cas de retard ou de consommation imprévue.'}]},
cp:{s:7,n:'Seuil de rentabilité',st:[{m:'Que signifie, pour vous, « être rentable » ?'},{m:'Recettes 2 400 000 F, charges variables 1 200 000 F. Marge sur coûts variables (F) ?',a:1200000,h:'Recettes − charges variables.',e:'2 400 000 − 1 200 000 = 1 200 000 F, soit 50 % des recettes.'},{m:'Charges fixes 600 000 F, taux de marge 50 %. Seuil de rentabilité (F) = charges fixes ÷ taux de marge. Calculez.',a:1200000,h:'Divisez par 0,5.',e:'600 000 ÷ 0,5 = 1 200 000 F.'}]}};
function tOk(s,v){if(s.a!==undefined)return Math.abs(num(v)-s.a)<.01;const t=v.toLowerCase();return s.k.filter(w=>t.includes(w)).length>=(s.n||1)}
function tStart(k){tu={k,i:0,tr:0,end:0,chat:[{r:'t',x:T[k].st[0].m}]};render()}
function tSend(){const v=$('#ti').value.trim();if(!v)return;const st=T[tu.k].st,s=st[tu.i];tu.chat.push({r:'u',x:v});let nx=1;
if(s.a!==undefined){if(tOk(s,v))tu.chat.push({r:'t',x:'Bonne réponse. '+s.e});else if(++tu.tr<2){tu.chat.push({r:'t',x:'Pas tout à fait. Indice : '+(s.h||'revérifiez votre calcul.')});nx=0}else tu.chat.push({r:'t',x:'Voici la correction : '+s.e})}else if(s.k)tu.chat.push({r:'t',x:'Comparez avec la réponse attendue : '+s.e+' (auto-évaluation : le tuteur ne comprend pas votre texte et ne le note pas).'})
if(nx){tu.tr=0;tu.i++;if(tu.i<st.length)tu.chat.push({r:'t',x:st[tu.i].m});else{tu.end=1;tu.chat.push({r:'t',x:'Séance terminée. Progression enregistrée sur cet appareil.'});S.td[tu.k]=Date.now();log('Tuteur : '+T[tu.k].n)}}render()}
function qStart(l,b){if(!l.length)return alert('Aucune question disponible ici.');qz={l,i:0,sc:0,f:[],end:Date.now()+l.length*6e4,done:0,r:null,beta:b||null,t0:Date.now()};clearInterval(tm);tm=setInterval(()=>{const e=$('#tm');if(!qz||qz.done||!e)return;const r=Math.max(0,Math.round((qz.end-Date.now())/1e3));e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(!r){qz.done=1;render()}},1e3);go('quiz')}
function qFails(){const A=AQ();qStart(S.fails.map(id=>A.find(q=>q.id==id)).filter(Boolean))}
function qAns(v){const q=qz.l[qz.i];if(!q.o&&isNaN(num(v)))return alert('Saisissez un nombre.');const ok=q.o?v==q.a:Math.abs(num(v)-q.a)<.01;S.ans[q.id]=ok;const t=S.st[q.s]=S.st[q.s]||{t:0,ok:0};t.t++;if(ok)t.ok++;if(ok)qz.sc++;else qz.f.push(q);save();qz.r={ok};render()}
function qEnd(){clearInterval(tm);const rest=qz.l.slice(qz.i+(qz.r?1:0)),f=qz.f.concat(rest);if(!qz.logged){qz.logged=1;S.fails=f.map(q=>q.id);S.hist.unshift({d:Date.now(),sc:qz.sc,n:qz.l.length});S.hist=S.hist.slice(0,20);log(`Quiz : ${qz.sc}/${qz.l.length}`);save()}
if(qz.beta){qz.fl=f;return bForm(f)}const w=[...new Set(f.map(q=>M[q.s][0]))];return `<h1>Bilan</h1><div class="c"><b>Score : ${qz.sc}/${qz.l.length}</b>${bar(Math.round(qz.sc/qz.l.length*100))}<p>${w.length?'Notions à réviser : '+w.map(esc).join(' ; '):'Aucune notion à réviser. Excellent !'}</p>${f.length?`<button class="b" onclick="qFails()">Refaire les questions échouées</button>`:''}<button class="b s" onclick="qz=null;render()">Retour</button></div>`}
function fcG(i,b){S.cards[i]={box:b,due:Date.now()+[1,3,7][b]*864e5};log('Carte révisée');fcShow=0;save();render()}
const SC=[['Restaurant de quartier',2500,60,900,40000],['Maquis d’hôtel',4000,40,1500,50000],['Restaurant gastronomique',6000,30,2200,55000]];
function simSc(){const s=SC[$('#sc').value];$('#sp').value=s[1];$('#sq').value=s[2];simCalc()}
function simCalc(){const s=SC[$('#sc').value],p=+$('#sp').value||0,q=Math.max(0,+$('#sq').value||0),L=$('#sm').value==1?.03:.12,us=Math.floor(q*(1-L)),cl=Math.max(0,Math.round(s[2]*(1-1.5*(p/s[1]-1)))),v=Math.min(us,cl),rec=v*p,cm=q*s[3],res=rec-cm-s[4],sat=Math.max(0,Math.min(100,Math.round(90-40*Math.max(0,p/s[1]-1)-(cl>us?15:0))));
$('#so').innerHTML=`<b>Résultat net : <span class="${res<0?'ko':'ok'}">${fm(res)}</span></b><br>Recettes ${fm(rec)} · Coût matière ${fm(cm)} (${rec?(cm/rec*100).toFixed(1):0} % des ventes, cible 25–35 %) · Satisfaction ${sat}/100<details><summary>Détail du calcul</summary><p class="m">Clients attendus = ${s[2]} × (1 − 1,5 × (prix ÷ ${s[1]} − 1)) = ${cl}.<br>Portions utilisables = ${q} × (1 − ${L*100} %) = ${us} (pertes : ${q-us}).<br>Portions vendues = min(${us} ; ${cl}) = ${v}.<br>Recettes = ${v} × ${p} = ${fm(rec)}. Coût matière = ${q} × ${s[3]} = ${fm(cm)}. Charges fixes = ${fm(s[4])}.<br>Résultat = recettes − coût matière − charges fixes. Satisfaction = 90 − 40 × (surcote du prix) − 15 si rupture (clients refusés).</p></details>`}
function pidGen(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='P-';try{const r=new Uint8Array(5);crypto.getRandomValues(r);r.forEach(x=>s+=a[x%32])}catch(e){for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*32)]}return s}
function bSel(){const i=+$('#bs').value,A=AQ();$('#bc').innerHTML=`<option value="-1">Toute la matière (${A.filter(q=>q.s==i).length} questions)</option>`+M[i][2].map((c,k)=>`<option value="${k}">${esc(c)} (${A.filter(q=>q.s==i&&q.ch===k).length})</option>`).join('')}
function bGo(){const i=+$('#bs').value,k=+$('#bc').value;qStart(AQ().filter(q=>q.s==i&&(k<0||q.ch===k)),{s:i,k})}

function bForm(f){if(qz.sent)return bShow(qz.sent);const o=n=>`<select id="${n}"><option value="">—</option>${[5,4,3,2,1].map(v=>`<option>${v}</option>`).join('')}</select>`;return `<h1>Fin de session</h1><div class="c"><b>Score : ${qz.sc}/${qz.l.length}</b>${bar(Math.round(qz.sc/qz.l.length*100))}</div><div class="c"><b>Questionnaire (1 min)</b><p class="m">Notes de 1 (faible) à 5 (excellent). Pas de nom ni de numéro.</p>Facilité d’utilisation ${o('f1')}Clarté des explications ${o('f2')}Utilité de la plateforme ${o('f3')}<input id="f4" maxlength="200" placeholder="Difficultés rencontrées (facultatif)"><input id="f5" maxlength="200" placeholder="Suggestions (facultatif)"><button class="b" onclick="bSend()">Générer mon bilan</button></div>`}
function bSend(){const r=['f1','f2','f3'].map(k=>+$('#'+k).value);if(r.some(x=>!x))return alert('Merci de noter les 3 critères.');const bad=new Set(qz.fl.map(q=>q.id)),g={};qz.l.forEach(q=>{const n=M[q.s][2][q.ch]||'Chapitre non précisé',x=g[n]=g[n]||{ok:0,n:0};x.n++;if(!bad.has(q.id))x.ok++});let d=Math.round((Date.now()-qz.t0)/1e3);if(d>7200)d=null;const b=qz.beta,R={v:1,app:'LAB-beta-1',pid:S.pid,date:new Date().toISOString().slice(0,10),matiere:M[b.s][0],chapitre:b.k<0?'toute la matière':M[b.s][2][b.k],score:qz.sc,n:qz.l.length,duree_s:d,maitrise:Object.keys(g).filter(n=>g[n].ok==g[n].n).map(n=>`${n} (${g[n].ok}/${g[n].n})`),a_retravailler:Object.keys(g).filter(n=>g[n].ok<g[n].n).map(n=>`${n} (${g[n].ok}/${g[n].n})`),note_facilite:r[0],note_clarte:r[1],note_utilite:r[2],difficultes:$('#f4').value.slice(0,200),suggestions:$('#f5').value.slice(0,200)};S.sess.unshift(R);S.sess=S.sess.slice(0,20);qz.sent=R;log('Session bêta terminée');render()}
function bShow(R){return `<h1>Bilan de session</h1><div class="c"><b>${R.score}/${R.n}</b> · ${esc(R.matiere)} · ${esc(R.chapitre)}${bar(Math.round(R.score/R.n*100))}<p><b class="ok">Bien réussi</b> : ${esc(R.maitrise.join(' ; ')||'–')}</p><p><b class="ko">À retravailler</b> : ${esc(R.a_retravailler.join(' ; ')||'–')}</p><p class="m">Durée : ${R.duree_s==null?'non fiable':R.duree_s+' s'}. Petit échantillon : à interpréter avec prudence.</p></div><div class="c"><b>Envoyez ce texte à l’organisateur</b><p class="m">Il contient votre code anonyme, vos scores et vos notes, plus ce que vous avez écrit dans les champs libres. Si la copie échoue, maintenez le doigt dans le texte puis « Tout sélectionner ».</p><textarea id="bt" rows="6" readonly>${esc(JSON.stringify(R))}</textarea><button class="b" onclick="bCopy()">Copier</button><button class="b s" onclick="qz=null;go('beta')">Nouveau test</button></div>`}
function bCopy(){try{const t=$('#bt');t.select();navigator.clipboard.writeText(t.value).catch(()=>{})}catch(e){}}
function agRun(){const L=$('#ag').value.split('\n').map(x=>{try{const j=JSON.parse(x.trim());return j&&j.app=='LAB-beta-1'&&typeof j.pid=='string'&&j.n>0?j:null}catch(e){return null}}).filter(Boolean),av=k=>L.length?(L.reduce((s,x)=>s+(+x[k]||0),0)/L.length).toFixed(1):'–',by={};L.forEach(x=>(by[x.matiere]=by[x.matiere]||[]).push(x));$('#ago').innerHTML=`<p>${L.length} bilan(s) valide(s), ${new Set(L.map(x=>x.pid)).size} participant(s). Notes moyennes /5 : facilité ${av('note_facilite')}, clarté ${av('note_clarte')}, utilité ${av('note_utilite')}</p>`+Object.keys(by).map(m=>{const a=by[m];return `<p><b>${esc(m)}</b> : ${a.length} session(s), score moyen ${Math.round(a.reduce((s,x)=>s+x.score/x.n,0)/a.length*100)} %<br><span class="m">À retravailler : ${esc([...new Set(a.reduce((s,x)=>s.concat(x.a_retravailler||[]),[]))].join(' ; ')||'–')}</span></p>`}).join('')+`<p class="m">Commentaires : ${esc(L.map(x=>((x.difficultes||'')+' '+(x.suggestions||'')).trim()).filter(Boolean).join(' | ')||'–')}</p>`}
function bkIn(){try{const j=JSON.parse($('#bi').value);if(!j||typeof j!='object'||!Array.isArray(j.acts))throw 0;S=Object.assign(D0(),j);save();render()}catch(e){alert('Sauvegarde invalide.')}}
function tAdd(){const o=$('#to').value.split(';').map(x=>x.trim()).filter(Boolean),a=+$('#ta').value-1;if(!$('#tq').value||o.length<2||!(a>=0&&a<o.length))return alert('Énoncé, 2 options minimum et numéro valide requis.');S.custom.push({id:'c'+Date.now(),s:+$('#ts').value,d:+$('#td').value,q:$('#tq').value,o,a,e:$('#te').value||'Voir le cours.'});log('Exercice ajouté');save();render()}
function tImp(){try{const j=JSON.parse($('#tj').value);if(!Array.isArray(j))throw 0;j.slice(0,100).forEach((x,k)=>{if(!x.q||x.a==null||!M[x.s]||(x.o&&(!Array.isArray(x.o)||!(x.a>=0&&x.a<x.o.length))))throw 0;S.custom.push({id:'c'+Date.now()+k,s:x.s,d:x.d||1,q:String(x.q),o:x.o,a:x.a,e:String(x.e||''),c:x.c?String(x.c):'',ch:Number.isInteger(x.ch)&&x.ch>=0&&x.ch<3?x.ch:undefined,src:x.off&&x.ref?2:1,ref:x.off&&x.ref?String(x.ref).slice(0,80):''})});log('Import JSON');save();render()}catch(e){alert('JSON invalide : vérifiez le format.')}}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==cur.v||(cur.v=='course'&&b.dataset.v=='lib')));$('#app').innerHTML=V[cur.v](cur.a);if(cur.v=='sim')simCalc();if(cur.v=='beta')bSel();if(cur.v=='tutor'&&tu){scrollTo(0,document.body.scrollHeight);if(!tu.end)$('#ti').focus()}else scrollTo(0,0)}
try{addEventListener('error',()=>{$('#err').hidden=false})}catch(e){}
render();
</script></body></html>
